[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcgp-meta-analyzer"
version = "0.1.0"
description = "Méta de Pokémon TCG Pocket à partir des tournois Limitless : parts de méta, matchups et meilleur deck selon les extensions choisies"
authors = [{ name = "Maxime Fruntes" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26"]

[project.optional-dependencies]
app = ["streamlit>=1.50", "altair>=5"]
dev = ["pytest>=8", "streamlit>=1.50", "altair>=5", "matplotlib>=3.8"]

[project.scripts]
ptcgp = "ptcgp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
